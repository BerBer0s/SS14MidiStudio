[package]
name = "ss14midi-studio"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "SS14 MIDI Studio — MIDI optimizer and editor for Space Station 14 instruments"

[[bin]]
name = "SS14MidiStudio"
path = "src/main.rs"

[dependencies]
ss14midi-core.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.36"
rfd = "0.17"
midir = "0.11"
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
