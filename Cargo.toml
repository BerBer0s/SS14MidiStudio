[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Berber0s"]

[workspace.dependencies]
ss14midi-core = { path = "crates/core" }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
encoding_rs = "0.8"
clap = { version = "4.6", features = ["derive"] }
proptest = "1.12"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
